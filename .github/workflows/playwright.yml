name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run Login tests (Chromium)
        run: npx playwright test tests/login.spec.ts --project=Chromium --reporter=list
        continue-on-error: true

      - name: Run Cart tests (Chromium)
        run: npx playwright test tests/cart.spec.ts --project=Chromium --reporter=list

      - name: Upload HTML report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Report test results
        run: |
          echo "✅ Tests completed. Report available in artifacts."
          if [ $? -ne 0 ]; then
            echo "❌ Some tests failed. Check the HTML report for details."
          fi
